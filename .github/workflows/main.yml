#!/usr/bin/env python3
import asyncio
import aiohttp
import os
import base64
import secrets
from aiohttp import web

_PW = base64.b64decode(os.environ.get("_G", "").encode()).decode()
_SESS: set = set()
_BACK = "http://127.0.0.1:6080"

_PAGE = """\
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Access</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#09090f}
body{display:flex;align-items:center;justify-content:center;
     font-family:system-ui,-apple-system,sans-serif}
.box{background:#111118;border:1px solid #1e1e2c;border-radius:14px;
     padding:44px 40px;width:340px;max-width:90vw}
h2{color:#d0d0e0;font-size:17px;font-weight:600;letter-spacing:.6px;
   text-transform:uppercase;margin-bottom:30px}
label{display:block;font-size:11px;color:#555;text-transform:uppercase;
      letter-spacing:.4px;margin-bottom:7px}
input[type=password]{width:100%;padding:11px 14px;background:#09090e;
  border:1px solid #252535;border-radius:8px;color:#ddd;
  font-size:14px;outline:none;transition:border-color .2s}
input[type=password]:focus{border-color:#4433aa}
button{width:100%;margin-top:22px;padding:12px;background:#3322aa;
       border:none;border-radius:8px;color:#fff;font-size:14px;
       font-weight:500;cursor:pointer;letter-spacing:.3px;
       transition:background-color .2s}
button:hover{background:#4433bb}
.err{margin-top:14px;color:#cc4444;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="box">
<h2>Authentication Required</h2>
<form method="POST" action="/auth">
<label>Access Credential</label>
<input type="password" name="p" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autofocus>
<button type="submit">Connect</button>
{ERR}
</form>
</div>
</body>
</html>
"""


def _login_page(err: str = "") -> web.Response:
    return web.Response(text=_PAGE.replace("{ERR}", err), content_type="text/html")


async def h_root(r: web.Request) -> web.Response:
    raise web.HTTPFound("/login")


async def h_login(r: web.Request) -> web.Response:
    return _login_page()


async def h_auth(r: web.Request) -> web.Response:
    d = await r.post()
    if d.get("p", "") == _PW:
        tok = secrets.token_hex(16)
        _SESS.add(tok)
        res = web.HTTPFound(
            "/vnc/vnc.html"
            "?host=&autoconnect=1&reconnect=1"
            "&reconnect_delay=2000&path=websockify&resize=scale"
        )
        res.set_cookie("sid", tok, httponly=True, samesite="Strict")
        return res
    return _login_page('<p class="err">Invalid credential — try again.</p>')


def _ok(r: web.Request) -> bool:
    return r.cookies.get("sid", "") in _SESS


async def h_vnc(r: web.Request) -> web.Response:
    if not _ok(r):
        raise web.HTTPFound("/login")
    raw = r.path
    sub = raw[4:] if raw.startswith("/vnc") else raw
    if not sub or sub == "/":
        sub = "/vnc.html"
    url = _BACK + sub
    if r.query_string:
        url += "?" + r.query_string
    async with aiohttp.ClientSession() as sess:
        async with sess.get(url) as resp:
            body = await resp.read()
            ct = resp.headers.get("Content-Type", "application/octet-stream")
            return web.Response(
                body=body,
                content_type=ct.split(";")[0].strip(),
                status=resp.status,
            )


async def h_ws(r: web.Request) -> web.WebSocketResponse:
    if not _ok(r):
        return web.Response(status=403)
    srv = web.WebSocketResponse(protocols=("binary", "base64"))
    await srv.prepare(r)
    qs = r.query_string
    tgt = "ws://127.0.0.1:6080/websockify" + (("?" + qs) if qs else "")
    async with aiohttp.ClientSession() as sess:
        cli = await sess.ws_connect(tgt, protocols=("binary", "base64"), heartbeat=15)

        async def to_client() -> None:
            async for m in cli:
                if srv.closed:
                    break
                if m.type == aiohttp.WSMsgType.BINARY:
                    await srv.send_bytes(m.data)
                elif m.type == aiohttp.WSMsgType.TEXT:
                    await srv.send_str(m.data)
                elif m.type in (aiohttp.WSMsgType.CLOSE, aiohttp.WSMsgType.ERROR):
                    break

        async def to_server() -> None:
            async for m in srv:
                if cli.closed:
                    break
                if m.type == aiohttp.WSMsgType.BINARY:
                    await cli.send_bytes(m.data)
                elif m.type == aiohttp.WSMsgType.TEXT:
                    await cli.send_str(m.data)
                elif m.type in (aiohttp.WSMsgType.CLOSE, aiohttp.WSMsgType.ERROR):
                    break

        await asyncio.gather(to_client(), to_server(), return_exceptions=True)
        await cli.close()
    return srv


app = web.Application(client_max_size=64 * 1024 * 1024)
app.router.add_get("/", h_root)
app.router.add_get("/login", h_login)
app.router.add_post("/auth", h_auth)
app.router.add_route("GET", "/websockify", h_ws)
app.router.add_get("/vnc", h_vnc)
app.router.add_get("/vnc/{tail:.*}", h_vnc)

if __name__ == "__main__":
    web.run_app(app, host="0.0.0.0", port=8080, access_log=None, print=None)
