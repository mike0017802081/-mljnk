name: Build & Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

env:
  SDK: /usr/local/lib/android/sdk
  AVD: s23emu

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb x11vnc wget curl git openssl
          pip3 install --quiet aiohttp websockify

      - name: Clone noVNC
        run: |
          git clone --depth=1 \
            https://github.com/novnc/noVNC "$HOME/novnc"
          git clone --depth=1 \
            https://github.com/novnc/websockify \
            "$HOME/novnc/utils/websockify"

      - name: Accept SDK licenses and pull system image
        run: |
          export ANDROID_SDK_ROOT="$SDK"
          TOOLS="$SDK/cmdline-tools/latest/bin"
          yes | "$TOOLS/sdkmanager" --licenses >/dev/null 2>&1
          "$TOOLS/sdkmanager" \
            "system-images;android-34;google_apis;x86_64"

      - name: Create S23 AVD
        run: |
          export ANDROID_SDK_ROOT="$SDK"
          TOOLS="$SDK/cmdline-tools/latest/bin"

          printf '\n' | "$TOOLS/avdmanager" create avd \
            -n "$AVD" \
            -k "system-images;android-34;google_apis;x86_64" \
            --force

          CFG="$HOME/.android/avd/${AVD}.avd/config.ini"

          python3 - "$CFG" << 'PY'
import sys, re

path = sys.argv[1]
overrides = {
  "hw.ramSize":              "8192",
  "hw.cpu.ncore":            "4",
  "hw.lcd.width":            "1080",
  "hw.lcd.height":           "2340",
  "hw.lcd.density":          "393",
  "hw.gpu.enabled":          "yes",
  "hw.gpu.mode":             "swiftshader_indirect",
  "hw.keyboard":             "yes",
  "hw.mainKeys":             "no",
  "hw.trackball":            "no",
  "hw.sdCard":               "no",
  "skin.name":               "1080x2340",
  "hw.device.name":          "Samsung Galaxy S23",
  "hw.device.manufacturer":  "Samsung",
  "disk.dataPartition.size": "12288M",
}
try:
  with open(path) as f:
    lines = f.readlines()
  written = set()
  out = []
  for line in lines:
    m = re.match(r"^(\S+)=(.*)$", line.rstrip())
    if m and m.group(1) in overrides:
      out.append(f"{m.group(1)}={overrides[m.group(1)]}\n")
      written.add(m.group(1))
    else:
      out.append(line)
  for k, v in overrides.items():
    if k not in written:
      out.append(f"{k}={v}\n")
except FileNotFoundError:
  out = [f"{k}={v}\n" for k, v in overrides.items()]
with open(path, "w") as f:
  f.writelines(out)
print("AVD config patched")
PY

